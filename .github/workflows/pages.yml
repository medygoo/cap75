name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  publish:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # L'appli vit sur https://cap75.pages.dev/ (Cloudflare Pages).
      # L'ancienne adresse GitHub ne fait plus que rediriger, en gardant ?… et #…
      # (liens d'e-mails déjà envoyés), et désinstalle son ancien service worker.
      - name: Préparer la redirection vers cap75.pages.dev
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Cap75 a déménagé</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://cap75.pages.dev/">
          <script src="./redirect.js"></script>
          </head><body style="font-family:system-ui;padding:24px">
          <p>Cap75 a déménagé : <a href="https://cap75.pages.dev/">cap75.pages.dev</a></p>
          </body></html>
          HTML
          cat > _site/redirect.js <<'JS'
          location.replace('https://cap75.pages.dev/' + location.search + location.hash);
          JS
          cat > _site/sw.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(
            caches.keys().then((k) => Promise.all(k.map((c) => caches.delete(c))))
              .then(() => self.registration.unregister())
              .then(() => self.clients.matchAll()).then((cs) => cs.forEach((c) => c.navigate(c.url)))
          ));
          JS
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
